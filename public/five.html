<!doctype html><meta charset="utf-8"><title>five</title>
<!--
  FIVE — the Instagram cut. 720x1280 CSS, captured at 1.5x = 1080x1920.

  WHAT IS REAL HERE, because that is the whole value of it: every card's state is read from the
  room's live `claims` map, which the RELAY writes. When a card says REFUSED it is because the
  relay refused that write -- no model was asked and nothing here decided it. The captions are
  the only authored thing, and they arrive through the same CRDT as everything else so they
  cannot drift out of sync with the events they describe.

  Nothing is sped up and nothing is re-enacted. If the refusal does not happen, the card does
  not turn red, and the take is worthless -- which is the property that makes it worth filming.
-->
<style>
 :root{--bg:#07080D;--ink:#FFFFFF;--dim:#93A6C0;--line:#1B2233;
   --ok:#3DDC84;--no:#FF4D4D;--hold:#5B8DEF;--warm:#F2A25C}
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:var(--bg);color:var(--ink);width:720px;height:1280px;overflow:hidden;
   font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

 /* A flat 1080p fill reads as a slide deck on a feed. The vignette gives the frame a centre. */
 #vig{position:absolute;inset:0;pointer-events:none;z-index:9;
   background:radial-gradient(120% 78% at 50% 34%,transparent 40%,rgba(0,0,0,.55) 100%)}

 /* ── CAPTION ─────────────────────────────────────────────────────────────────────────────
    The slam, borrowed from social60-916: scale + blur + overshoot. A fade reads as slow. */
 #cap{position:absolute;left:44px;right:44px;top:74px;z-index:6;text-align:center;height:150px}
 #cap .a{font-weight:800;font-size:56px;line-height:1.0;letter-spacing:-2.2px;
   opacity:0;transform:scale(1.14) translateY(8px);filter:blur(9px);
   transition:opacity .13s,transform .2s cubic-bezier(.14,1.2,.3,1),filter .18s}
 #cap .b{font-weight:500;font-size:23px;line-height:1.3;color:var(--dim);margin-top:14px;
   opacity:0;transform:translateY(9px);transition:opacity .1s,transform .1s}
 #cap.up .a{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}
 #cap.up .b{opacity:1;transform:translateY(0);transition:opacity .2s .08s,transform .24s .08s}
 #cap.hot .a{color:var(--no)}

 /* ── THE FIVE ────────────────────────────────────────────────────────────────────────── */
 #devs{position:absolute;left:38px;right:38px;top:250px;z-index:5}
 .dev{display:flex;align-items:center;gap:14px;height:104px;padding:0 20px;margin-bottom:10px;
   border:1px solid var(--line);border-radius:16px;background:#0B0E17;
   opacity:0;transform:translateY(14px) scale(.985);
   transition:opacity .22s,transform .3s cubic-bezier(.14,1.1,.3,1),border-color .12s,background .12s}
 .dev.in{opacity:1;transform:none}
 .dev .dot{width:11px;height:11px;border-radius:50%;background:var(--dim);flex:none;
   transition:background .12s,box-shadow .12s}
 .dev .who{flex:none;width:186px}
 .dev .who b{display:block;font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
 .dev .who span{display:block;font-size:15px;color:var(--dim);margin-top:3px;font-weight:500}
 .dev .file{flex:1;font-family:Consolas,monospace;font-size:17px;color:var(--dim);
   white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s}
 .dev .chip{flex:none;font-family:Consolas,monospace;font-size:13px;font-weight:700;
   letter-spacing:1.6px;padding:7px 12px;border-radius:8px;background:#141A28;color:var(--dim);
   transition:background .1s,color .1s}

 /* Editing: the file is theirs and the relay agrees. */
 .dev.edit{border-color:rgba(61,220,132,.34);background:#0A1410}
 .dev.edit .dot{background:var(--ok);box-shadow:0 0 14px rgba(61,220,132,.8)}
 .dev.edit .file{color:#C6F5DC}
 .dev.edit .chip{background:rgba(61,220,132,.14);color:var(--ok)}

 /* Holding the contested file. */
 .dev.hold{border-color:rgba(91,141,239,.5);background:#0A1020}
 .dev.hold .dot{background:var(--hold);box-shadow:0 0 16px rgba(91,141,239,.9)}
 .dev.hold .file{color:#CFE0FF}
 .dev.hold .chip{background:rgba(91,141,239,.18);color:#9DC0FF}

 /* Refused BY THE RELAY. The one frame the whole video exists for. */
 .dev.deny{border-color:rgba(255,77,77,.62);background:#18090C;animation:shake .30s}
 .dev.deny .dot{background:var(--no);box-shadow:0 0 18px rgba(255,77,77,.95)}
 .dev.deny .file{color:#FFC0C0}
 .dev.deny .chip{background:rgba(255,77,77,.20);color:#FF8080}
 @keyframes shake{0%,100%{transform:none}22%{transform:translateX(-8px)}62%{transform:translateX(5px)}}

 /* ── THE CONVERGENCE POINT ───────────────────────────────────────────────────────────── */
 #conv{position:absolute;left:38px;right:38px;top:836px;z-index:5;
   border:1px dashed #263149;border-radius:16px;padding:20px 22px;background:#0A0D16;
   opacity:0;transform:translateY(10px);transition:opacity .24s,transform .3s,border-color .16s,background .16s}
 #conv.in{opacity:1;transform:none}
 #conv.live{border-style:solid;border-color:rgba(255,77,77,.5);background:#120A10}
 #conv .lbl{font-size:13px;font-weight:700;letter-spacing:2.6px;color:var(--dim)}
 #conv .path{font-family:Consolas,monospace;font-size:27px;font-weight:700;margin-top:9px;
   letter-spacing:-.5px}
 #conv .sub{font-size:17px;color:var(--dim);margin-top:11px;line-height:1.35}
 #conv .sub b{color:#9DC0FF;font-weight:700}

 /* ── THE COUNTER ─────────────────────────────────────────────────────────────────────── */
 #tally{position:absolute;left:38px;right:38px;top:1046px;z-index:6;text-align:center;
   opacity:0;transform:scale(.94);transition:opacity .18s,transform .3s cubic-bezier(.14,1.2,.3,1)}
 #tally.up{opacity:1;transform:none}
 #tally i{display:block;font-style:normal;font-weight:800;font-size:104px;line-height:1;
   letter-spacing:-6px;color:var(--no);font-variant-numeric:tabular-nums}
 #tally u{display:block;text-decoration:none;font-size:19px;font-weight:600;color:var(--dim);
   margin-top:10px;letter-spacing:.3px}

 /* ── END CARD ────────────────────────────────────────────────────────────────────────── */
 #end{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;
   align-items:center;justify-content:center;gap:0;opacity:0;pointer-events:none;transition:opacity .3s}
 #end.up{opacity:1}
 #end h1{font-size:74px;font-weight:800;letter-spacing:-3.4px;line-height:1}
 #end h2{font-size:26px;font-weight:500;color:var(--dim);margin-top:20px;text-align:center;line-height:1.4}
 /* The breathe is not decoration. Page.startScreencast only emits a frame when something
    REPAINTS, and the pulsing LIVE dot is what keeps the capture alive all the way through --
    hiding it for the end card left the card with almost no frames and the encode simply
    dropped it. Something on screen must always be moving or the camera stops. */
 #end .free{margin-top:42px;font-family:Consolas,monospace;font-size:20px;font-weight:700;
   letter-spacing:2px;color:var(--ok);border:1px solid rgba(61,220,132,.4);border-radius:10px;
   padding:13px 26px;background:rgba(61,220,132,.07);animation:breathe 2.1s ease-in-out infinite}
 @keyframes breathe{0%,100%{opacity:.72;box-shadow:0 0 0 rgba(61,220,132,0)}
   50%{opacity:1;box-shadow:0 0 26px rgba(61,220,132,.22)}}
 #end .h{margin-top:30px;font-size:21px;color:var(--dim);font-weight:600}

 /* Live badge — says the footage is a running system, not a render. */
 #live{position:absolute;right:38px;top:26px;z-index:7;display:flex;align-items:center;gap:8px;
   font-size:13px;font-weight:700;letter-spacing:2.2px;color:var(--dim)}
 #live b{width:8px;height:8px;border-radius:50%;background:var(--no);animation:pulse 1.4s infinite}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
 #err{position:absolute;left:0;right:0;bottom:0;z-index:20;background:#300;color:#fdd;padding:10px;
   font:12px Consolas,monospace;display:none}
</style>

<div id="live"><b></b>LIVE ROOM</div>
<div id="cap"><div class="a"></div><div class="b"></div></div>
<div id="devs"></div>
<div id="conv">
  <div class="lbl">EVERY FEATURE HAS TO REGISTER HERE</div>
  <div class="path">src/routes/index.js</div>
  <div class="sub" id="convsub">nobody holds it</div>
</div>
<div id="tally"><i>0</i><u>collisions refused at the keystroke</u></div>
<div id="end">
  <h1>Multiplayer AI</h1>
  <h2>Humans and their agents,<br>editing one codebase live.</h2>
  <div class="free">FREE WHILE IN BETA</div>
  <div class="h" id="handle">hivecode.getgrm.tech</div>
</div>
<div id="vig"></div>
<div id="err"></div>

<script type="module">
const $ = (s) => document.querySelector(s)
const err = (m) => { const e = $('#err'); e.style.display = 'block'; e.textContent = m }

// ONE Yjs, served next to this page. Two module URLs is two instances: the bulk sync lands so
// the page looks correct and then incremental updates silently stop. That cost two whole
// investigations on /control before anyone read the "Yjs was already imported" warning.
let Y, WS
try { const m = await import('./hive-crdt.js'); Y = m.Y; WS = m.WebsocketProvider }
catch (e) { err('Q471 could not load hive-crdt.js — ' + e.message) }

const q = new URLSearchParams(location.search)
const ROOM = q.get('room') || 'five'
const RELAY = (location.hash || '').replace(/^#/, '') || 'ws://127.0.0.1:1239'

const doc = new Y.Doc()
const provider = new WS(RELAY, ROOM, doc, { WebSocketPolyfill: WebSocket })
const claims = doc.getMap('claims')     // region -> {by,intent,at,ttl} — written by the RELAY path
const stage  = doc.getMap('stage')      // the driver's cues: caption, cast, refusals

const CONTESTED = 'src/routes/index.js'
let cast = []          // [{name, with, file}]
let denied = {}        // name -> true, set by the driver the instant the relay refuses it
let shown = 0

function renderCast() {
  const host = $('#devs')
  if (host.childElementCount !== cast.length) {
    host.innerHTML = cast.map((d) => `
      <div class="dev" data-n="${d.name}">
        <div class="dot"></div>
        <div class="who"><b>${d.name}</b><span>+ ${d.with}</span></div>
        <div class="file">${d.file || '—'}</div>
        <div class="chip">IDLE</div>
      </div>`).join('')
  }
  for (const d of cast) {
    const el = host.querySelector(`[data-n="${d.name}"]`)
    if (!el) continue
    // The claim is held by the ASSISTANT's room identity ("Ada / Claude Code"), not by the
    // person's short name. Matching only the short name showed every card as IDLE while the
    // relay had in fact granted all five — the card contradicted the footage it was filming.
    const holder = claims.get(d.file)
    const mine = holder && (holder.by === d.room || holder.by === d.name)
    const isContested = d.file === CONTESTED
    el.classList.remove('edit', 'hold', 'deny')
    let chip = 'IDLE'
    if (denied[d.name]) { el.classList.add('deny'); chip = 'REFUSED' }
    else if (mine && isContested) { el.classList.add('hold'); chip = 'HOLDS IT' }
    else if (mine) { el.classList.add('edit'); chip = 'EDITING' }
    // A refused card must name the file it was refused ON. Leaving its own feature file there
    // read as "Kai was refused on search.js", which never happened.
    el.querySelector('.file').textContent = (denied[d.name] ? CONTESTED : d.file) || '—'
    el.querySelector('.chip').textContent = chip
  }
}

function renderStage() {
  const c = stage.get('cap') || {}
  const capEl = $('#cap')
  capEl.querySelector('.a').textContent = c.a || ''
  capEl.querySelector('.b').textContent = c.b || ''
  capEl.classList.toggle('up', !!c.a)
  capEl.classList.toggle('hot', !!c.hot)

  const n = Number(stage.get('reveal') || 0)
  if (n !== shown) {
    shown = n
    ;[...document.querySelectorAll('.dev')].forEach((el, i) => el.classList.toggle('in', i < n))
  }
  $('#conv').classList.toggle('in', !!stage.get('conv'))
  $('#conv').classList.toggle('live', !!stage.get('convLive'))

  const holder = claims.get(CONTESTED)
  $('#convsub').innerHTML = holder
    ? `held by <b>${holder.by}</b> — every other write to it is refused by the relay`
    : 'nobody holds it'

  const t = Number(stage.get('tally') || 0)
  $('#tally').classList.toggle('up', !!stage.get('showTally'))
  $('#tally i').textContent = t
  $('#end').classList.toggle('up', !!stage.get('end'))
  $('#live').style.opacity = stage.get('end') ? 0 : 1
  // --handle was documented and plumbed through the driver but never read here, so it silently
  // did nothing. The default is the site, which is the useful thing to leave on screen anyway.
  if (stage.get('handle')) $('#handle').textContent = stage.get('handle')
}

function all() {
  cast = stage.get('cast') || []
  denied = stage.get('denied') || {}
  renderCast(); renderStage()
}
stage.observe(all)
claims.observe(all)
provider.on('sync', (s) => { if (s) all() })
all()
</script>
