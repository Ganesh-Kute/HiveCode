<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hivecode — live map</title>
<style>
  :root{
    --bg:#07080c; --panel:#0e1018; --line:#1c2030; --ink:#e7e9f0; --dim:#8b93a7;
    --built:#2fd27a; --broken:#ff5a63; --wip:#ffc24b; --planned:#5b6b8c; --ghost:#3a4056;
    --accent:#4da3ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  /* width/height are NOT optional here. A canvas is a replaced element, so `inset:0` alone leaves
     it at its intrinsic 300x150 and the whole graph draws around a centre that is off screen. */
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;cursor:grab}
  canvas.drag{cursor:grabbing}

  .hud{position:fixed;z-index:2;pointer-events:none}
  .hud > *{pointer-events:auto}

  #top{top:0;left:0;right:0;display:flex;gap:10px;align-items:center;
    padding:10px 14px;background:linear-gradient(#07080cf2,#07080c00);}
  #top b{font-weight:650;letter-spacing:.2px}
  #room{color:var(--dim)}
  #conn{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
  #dot{width:8px;height:8px;border-radius:50%;background:#555;box-shadow:0 0 8px #0000}
  #dot.on{background:var(--built);box-shadow:0 0 10px var(--built)}
  #dot.off{background:var(--broken)}

  #legend{left:14px;bottom:14px;max-width:min(560px,calc(100% - 28px));
    background:#0e1018d9;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;
    backdrop-filter:blur(8px)}
  #groupKey{display:flex;gap:5px 11px;flex-wrap:wrap}
  #stateKey{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  #legend span{display:flex;align-items:center;gap:6px;color:var(--dim)}
  #legend i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  /* State is SHAPE, because hue is already spoken for. Solid = real, ringed = in progress,
     hollow = only agreed. The key has to show the same shapes the canvas draws. */
  #legend i.sh{width:11px;height:11px;border-radius:50%;box-sizing:border-box}
  .sh-built{background:#cfd6e4}
  .sh-wip{background:#cfd6e4;box-shadow:0 0 0 2px var(--wip)}
  .sh-broken{background:#cfd6e4;box-shadow:0 0 0 2px var(--broken)}
  .sh-planned{background:transparent;border:1.5px dashed #8492ad}
  #groupKey span{font-size:11px;cursor:pointer;user-select:none}
  #groupKey span.off{opacity:.3}

  #side{right:14px;top:58px;width:286px;max-height:calc(100% - 130px);overflow:auto;
    background:#0e1018e6;border:1px solid var(--line);border-radius:12px;padding:14px;
    backdrop-filter:blur(8px);display:none}
  #side.show{display:block}
  #side h3{margin:0 0 2px;font-size:15px}
  #side .k{color:var(--dim);font-size:12px;margin-top:10px;text-transform:uppercase;letter-spacing:.6px}
  #side .v{word-break:break-word}
  #side .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;
    text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  #side ul{margin:4px 0 0;padding-left:16px}
  #side li{color:var(--dim)}
  #close{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--dim);
    font-size:18px;cursor:pointer;line-height:1}

  #stats{left:14px;top:58px;background:#0e1018e6;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-size:12px;color:var(--dim);width:238px;backdrop-filter:blur(8px)}
  #stats b{color:var(--ink);font-weight:600}

  #stats input{width:100%;background:#07080c;border:1px solid var(--line);border-radius:7px;
    color:var(--ink);padding:6px 9px;font:inherit;font-size:12px;outline:none;margin-bottom:10px}
  #stats input:focus{border-color:var(--accent)}
  #reading{font-size:12px;line-height:1.6;max-height:40vh;overflow:auto}
  #reading .r{display:block;overflow-wrap:anywhere}
  #reading b{color:var(--ink);font-weight:600}
  #reading .r{margin-bottom:7px}
  #reading .bad{color:var(--broken)}
  .depth{display:flex;align-items:center;gap:5px;margin-top:11px;padding-top:10px;
    border-top:1px solid var(--line);font-size:11px}
  .depth span{flex:1}
  .depth button{background:#07080c;border:1px solid var(--line);color:var(--dim);
    border-radius:5px;padding:2px 7px;font:inherit;font-size:11px;cursor:pointer}
  .depth button.on{border-color:var(--accent);color:var(--accent)}
  #legend span{cursor:pointer;user-select:none}
  #legend span.off{opacity:.35}
  #legend span.on{color:var(--ink)}
  #legend b{color:var(--ink);font-weight:600;margin-left:1px}
  #clearF{color:var(--accent)}
  #hint{right:14px;bottom:14px;color:var(--dim);font-size:11px;text-align:right;line-height:1.7}
  #err{position:fixed;inset:auto 0 0 0;background:#3a0f14;color:#ffd9dc;padding:10px 14px;
    font-size:13px;z-index:5;display:none}
  #empty{position:fixed;inset:0;display:none;place-items:center;text-align:center;z-index:1;padding:24px}
  #empty div{max-width:440px;color:var(--dim)}
  #empty code{color:var(--ink);background:#0e1018;border:1px solid var(--line);
    border-radius:6px;padding:2px 6px;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="top">
  <b>Hivecode</b> <span id="room">—</span>
  <span id="conn"><span id="dot"></span><span id="connText">connecting…</span></span>
</div>

<div class="hud" id="stats">
  <input id="q" placeholder="search…" autocomplete="off">
  <div id="reading"></div>
  <div class="depth">
    <span>focus depth</span>
    <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button><button data-d="99">all</button>
  </div>
</div>

<div class="hud" id="legend">
  <!-- Colour now means GROUP, so the group key has to be here or the palette is decoration a
       reader has to reverse-engineer. Shape means state, and it gets its own row below. -->
  <div id="groupKey"></div>
  <div id="stateKey">
    <span data-s="built"><i class="sh sh-built"></i>built <b id="sB">0</b></span>
    <span data-s="wip"><i class="sh sh-wip"></i>wip <b id="sW">0</b></span>
    <span data-s="broken"><i class="sh sh-broken"></i>broken <b id="sX">0</b></span>
    <span data-s="planned"><i class="sh sh-planned"></i>planned <b id="sP">0</b></span>
    <span id="clearF" style="display:none">clear filter ×</span>
  </div>
</div>

<div class="hud" id="side">
  <button id="close" title="close">×</button>
  <h3 id="dTitle">—</h3>
  <span class="pill" id="dState">—</span>
  <div id="dBody"></div>
</div>

<div class="hud" id="hint">drag to rotate · scroll to zoom · click a node<br>shift-drag to pan · R to recentre</div>
<div id="empty"><div>
  <p>This room has no map yet.</p>
  <p>Add the first node:</p>
  <p><code>node hive-map.js "&lt;link&gt;" you add relay --state built --kind service</code></p>
</div></div>
<div id="err"></div>

<script type="module">
// ONE Yjs, loaded from the bundle served next to this page.
//
// This page must NEVER import yjs or y-websocket from a CDN. Doing that is what made the control
// room silently deaf for two investigations: two module URLs are two module instances, the bulk
// sync on join lands so the page looks correct, and then incremental updates stop applying while
// the socket reports perfectly healthy. It cannot be reproduced in node, because npm dedupes.
let Y, WS
const errEl = document.getElementById('err')
const err = (m) => { errEl.textContent = m || ''; errEl.style.display = m ? 'block' : 'none' }

try {
  const m = await import('./hive-crdt.js')
  Y = m.Y; WS = m.WebsocketProvider
} catch (e) {
  err('Q471 could not load hive-crdt.js (it is served next to this page). ' + e.message)
}

// ---------------------------------------------------------------- connection
const qs = new URLSearchParams(location.search)
const room = qs.get('room') || 'personal-agi'
const relay = qs.get('relay') || (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host
const token = qs.get('token') || ''
document.getElementById('room').textContent = room

const dot = document.getElementById('dot')
const connText = document.getElementById('connText')

let doc, provider, graph, claims
if (Y) {
  doc = new Y.Doc()
  const opts = { connect: true }
  if (token) opts.params = { token }
  provider = new WS(relay, room, doc, opts)
  graph = doc.getMap('graph')
  claims = doc.getMap('claims')

  provider.on('status', (e) => {
    const on = e.status === 'connected'
    dot.className = on ? 'on' : 'off'
    connText.textContent = on ? 'live' : e.status
  })
  provider.awareness.setLocalStateField('user', { name: 'map-viewer', kind: 'human' })
  graph.observeDeep(() => rebuild())
  claims.observe(() => rebuild())
  provider.awareness.on('change', () => rebuild())
}

// ---------------------------------------------------------------- model
// `sim` holds live physics state keyed by node id and SURVIVES rebuilds, so a node that already
// found its place does not jump when an unrelated node is added. That continuity is most of why a
// graph feels like a map rather than a chart.
const sim = new Map()
let nodes = [], edges = [], members = []

// ---- FOCUS. This is the whole answer to "how am I supposed to read this".
// A graph of 23 equal dots is 23 things shouting at once. Obsidian's real trick is not the layout,
// it is that hovering one node fades everything it does not touch -- so at any moment you are
// looking at ONE neighbourhood rather than the whole system. Size carries importance, dimming
// carries relevance, and the graph becomes legible without anything being removed from it.
const adj = new Map()      // id -> Set(neighbours), undirected, for walking the neighbourhood
const deg = new Map()      // id -> connection count, which drives node size
let focusId = null         // hovered or selected
let depth = 1              // hops lit around the focus
let filterState = null     // light only this state and what it touches
// Filtering by GROUP is the other half of the same idea: colour tells you the subsystems exist,
// clicking one is how you look at just that subsystem and the things it touches.
let filterGroup = null
let query = ''

function neighbourhood(id, d) {
  const seen = new Set([id])
  let frontier = [id]
  for (let i = 0; i < d && frontier.length; i++) {
    const next = []
    for (const a of frontier) for (const b of (adj.get(a) || [])) if (!seen.has(b)) { seen.add(b); next.push(b) }
    frontier = next
  }
  return seen
}

/** Which nodes are lit. Everything else is drawn faint rather than hidden, so the shape of the
 *  whole system stays visible while one part of it is readable. null means "everything". */
function litSet() {
  if (query) {
    const q = query.toLowerCase()
    const out = new Set()
    for (const n of nodes) {
      if (((n.label || '') + ' ' + n.id + ' ' + (n.note || '')).toLowerCase().includes(q)) {
        for (const x of neighbourhood(n.id, 1)) out.add(x)
      }
    }
    return out
  }
  if (focusId) return neighbourhood(focusId, depth)
  if (filterGroup) {
    const out = new Set()
    for (const n of nodes) if (n.group === filterGroup) for (const x of neighbourhood(n.id, 1)) out.add(x)
    return out
  }
  if (filterState) {
    const out = new Set()
    for (const n of nodes) if (n.state === filterState) for (const x of neighbourhood(n.id, 1)) out.add(x)
    return out
  }
  return null
}

const STATE_COLOR = { built: '#2fd27a', broken: '#ff5a63', wip: '#ffc24b', planned: '#5b6b8c' }
const GHOST = '#3a4056'

// TWO DIMENSIONS, TWO CHANNELS. A node answers two questions -- which part of the system is this,
// and is it real -- and encoding both in one colour is why ninety identical green dots told a
// reader nothing. HUE now carries the group (where you are), and the node's TREATMENT carries the
// state (filled / ringed / hollow). You can read either one without the other getting in the way.
//
// The ramp runs cyan -> violet -> amber so neighbouring subsystems are never neighbouring hues.
// `tools`, `flow` and `rule` are deliberately desaturated slate: there are thirty of them and they
// are scaffolding around the seven subsystems, so they must recede rather than compete.
const GROUP_COLOR = {
  core: '#8ef6ff', identity: '#a78bfa', perms: '#60a5fa', locks: '#22d3ee',
  ipc: '#34d399', sched: '#a3e635', audit: '#fbbf24', policy: '#fb923c',
  medium: '#7dd3fc', surface: '#f472b6', dist: '#2dd4bf', proof: '#4ade80',
  tools: '#5b6b8c', flow: '#5b6b8c', rule: '#8492ad', gap: '#f87171',
}
const hueOf = (n) => (n.ghost ? GHOST : (GROUP_COLOR[n.group] || GROUP_COLOR.tools))

// Parsed once per colour, not once per node per frame: at 87 nodes and 113 edges this runs
// thousands of times a second and a regex in the draw loop is measurable.
const rgbCache = new Map()
function rgb(hex) {
  let v = rgbCache.get(hex)
  if (!v) {
    v = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]
    rgbCache.set(hex, v)
  }
  return v
}
const rgba = (hex, a) => { const c = rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})` }
// An edge between two groups is drawn as a gradient between their hues, so a line that leaves its
// cluster is visible as a departure rather than as one more grey thread in a pile of grey threads.
const mix = (h1, h2, t) => {
  const a = rgb(h1), b = rgb(h2)
  return [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t)]
}

// A deterministic starting point per id — same id, same seed, every reload. Math.random() here
// would make the layout different on every refresh, which destroys the one thing a spatial map is
// for: you learn where things are.
function seedPos(id) {
  let h = 2166136261
  for (let i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619) }
  const a = ((h >>> 0) % 1000) / 1000 * Math.PI * 2
  const b = (((h >>> 10) % 1000) / 1000 - 0.5) * Math.PI
  const r = 60 + ((h >>> 20) % 60)
  return { x: r * Math.cos(b) * Math.cos(a), y: r * Math.sin(b), z: r * Math.cos(b) * Math.sin(a) }
}

function rebuild() {
  if (!graph) return
  const ns = new Map(), es = []
  graph.forEach((v, k) => {
    if (!v) return
    if (k.startsWith('n:')) ns.set(v.id, { ...v, ghost: false })
    else if (k.startsWith('e:')) es.push(v)
  })
  // An edge may name a node nobody has added yet — that is allowed on purpose, so an agent can
  // record "Director needs timeline" the moment it learns it. Draw the missing end as a ghost:
  // a hole in the map is information, not an error.
  for (const e of es) {
    for (const id of [e.from, e.to]) {
      if (!ns.has(id)) ns.set(id, { id, label: id, state: 'planned', kind: 'unknown', ghost: true, note: '', file: '' })
    }
  }
  nodes = [...ns.values()]
  edges = es
  for (const n of nodes) {
    if (!sim.has(n.id)) sim.set(n.id, { ...seedPos(n.id), vx: 0, vy: 0, vz: 0 })
  }
  for (const id of [...sim.keys()]) if (!ns.has(id)) sim.delete(id)

  members = []
  if (provider) {
    const seen = new Set()
    for (const s of provider.awareness.getStates().values()) {
      const u = s && s.user
      if (u && u.name && !seen.has(u.name)) { seen.add(u.name); members.push(u) }
    }
  }

  adj.clear(); deg.clear()
  for (const n of nodes) { adj.set(n.id, new Set()); deg.set(n.id, 0) }
  for (const e of edges) {
    if (adj.has(e.from)) { adj.get(e.from).add(e.to); deg.set(e.from, deg.get(e.from) + 1) }
    if (adj.has(e.to)) { adj.get(e.to).add(e.from); deg.set(e.to, deg.get(e.to) + 1) }
  }

  // The group key is built from the data, not hardcoded, so a room with different groups explains
  // itself and a group nobody uses never appears. Ordered biggest-first: the eye should meet the
  // parts that dominate the picture before the ones that barely appear in it.
  const gc = new Map()
  for (const n of nodes) if (!n.ghost && n.group) gc.set(n.group, (gc.get(n.group) || 0) + 1)
  const gk = document.getElementById('groupKey')
  const wanted = [...gc.entries()].sort((a, b) => b[1] - a[1]).map(([g, c]) => g + ':' + c).join('|')
  if (gk.dataset.sig !== wanted) {
    gk.dataset.sig = wanted
    gk.innerHTML = [...gc.entries()].sort((a, b) => b[1] - a[1]).map(([g, c]) =>
      `<span data-g="${g}"><i style="background:${GROUP_COLOR[g] || GROUP_COLOR.tools}"></i>${g} <b>${c}</b></span>`).join('')
    for (const sp of gk.querySelectorAll('span[data-g]')) {
      sp.onclick = () => {
        filterGroup = filterGroup === sp.dataset.g ? null : sp.dataset.g
        for (const o of gk.querySelectorAll('span[data-g]')) o.classList.toggle('off', !!filterGroup && o.dataset.g !== filterGroup)
      }
    }
  }

  const st = (k) => nodes.filter((n) => !n.ghost && n.state === k).length
  document.getElementById('sB').textContent = st('built')
  document.getElementById('sX').textContent = st('broken')
  document.getElementById('sW').textContent = st('wip')
  document.getElementById('sP').textContent = st('planned')
  document.getElementById('empty').style.display = nodes.length ? 'none' : 'grid'
  renderReading()
  energy = 1 // a change re-heats the layout so it settles into the new shape
}

/** Say in words what the picture means.
 *
 *  A graph you cannot read is a graph that needs a sentence. The shape answers "what connects to
 *  what"; it does NOT answer "so what". These lines do, and they are the first thing a person
 *  should be able to take away without touching the mouse. */
function renderReading() {
  const el = document.getElementById('reading')
  const real = nodes.filter((n) => !n.ghost)
  if (!real.length) { el.innerHTML = ''; return }
  const out = []
  const by = (k) => real.filter((n) => n.state === k)
  const nameOf = (id) => (nodes.find((n) => n.id === id) || {}).label || id

  out.push('<div class="r"><b>' + real.length + '</b> parts, <b>' + edges.length + '</b> dependencies</div>')

  // Broken things other things rely on. This is the only line here that changes what you do today.
  const bad = by('broken')
    .map((n) => ({ n, on: edges.filter((e) => e.to === n.id).length }))
    .filter((x) => x.on > 0)
    .sort((a, b) => b.on - a.on)
  if (bad.length) {
    out.push('<div class="r bad">broken, and depended on:<br>' +
      bad.map((x) => '<b>' + x.n.label + '</b> &mdash; ' + x.on + ' need' + (x.on > 1 ? '' : 's') + ' it').join('<br>') +
      '</div>')
  }

  const hub = [...deg.entries()].sort((a, b) => b[1] - a[1])[0]
  if (hub && hub[1] > 1) out.push('<div class="r">most connected: <b>' + nameOf(hub[0]) + '</b> (' + hub[1] + ')</div>')

  // Points at nothing and nothing points at it: work nobody is currently waiting on.
  const orphans = real.filter((n) => (deg.get(n.id) || 0) === 0)
  if (orphans.length) {
    out.push('<div class="r">nothing connects to: ' + orphans.map((n) => '<b>' + n.label + '</b>').join(', ') + '</div>')
  }

  el.innerHTML = out.join('')
}

/** Claims are keyed by the region (file path) they lock. A node pulses while its file is held. */
function heldBy(node) {
  if (!claims || !node.file) return null
  let hit = null
  claims.forEach((c, region) => {
    if (!c || !c.by || hit) return
    if (region === node.file || region.endsWith('/' + node.file) || node.file.endsWith(region)) {
      const left = (Number(c.ttl) || 0) - (Date.now() - (Number(c.at) || 0))
      if (left > 0) hit = { by: c.by, intent: c.intent || 'edit', left }
    }
  })
  return hit
}

// ---------------------------------------------------------------- physics
// Plain O(n²) repulsion plus springs. At the scale a human can read — a couple of hundred nodes —
// this is far cheaper than the barnes-hut it would take to avoid it, and it is exact.
let energy = 1
function step() {
  if (energy < 0.002) return
  const arr = nodes.map((n) => sim.get(n.id)).filter(Boolean)
  const REP = 14000, SPRING = 0.010, REST = 130, CENTER = 0.0012, DAMP = 0.88

  for (let i = 0; i < arr.length; i++) {
    for (let j = i + 1; j < arr.length; j++) {
      const a = arr[i], b = arr[j]
      let dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z
      let d2 = dx * dx + dy * dy + dz * dz
      if (d2 < 1) { d2 = 1; dx = (i - j) || 1 }
      const f = REP / d2 / Math.sqrt(d2)
      a.vx += dx * f; a.vy += dy * f; a.vz += dz * f
      b.vx -= dx * f; b.vy -= dy * f; b.vz -= dz * f
    }
  }
  for (const e of edges) {
    const a = sim.get(e.from), b = sim.get(e.to)
    if (!a || !b) continue
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z
    const d = Math.hypot(dx, dy, dz) || 1
    const f = (d - (e.ekind === 'then' ? REST * 1.25 : REST)) * SPRING
    a.vx += dx / d * f; a.vy += dy / d * f; a.vz += dz / d * f
    b.vx -= dx / d * f; b.vy -= dy / d * f; b.vz -= dz / d * f
  }
  // GROUP COHESION. Springs alone lay out a graph by its edges, which produces one continuous
  // cloud -- correct, and unreadable, because the thing a person is trying to see first is "what
  // are the parts". Pulling each node gently toward its own group's centre of mass makes the
  // subsystems separate into visible islands without overriding the real structure: it is an
  // order of magnitude weaker than the springs, so an edge that crosses groups still pulls its
  // ends together and the crossing stays visible as a crossing.
  const cen = new Map()
  for (const n of nodes) {
    const p = sim.get(n.id); if (!p || !n.group) continue
    let c = cen.get(n.group); if (!c) cen.set(n.group, c = { x: 0, y: 0, z: 0, n: 0 })
    c.x += p.x; c.y += p.y; c.z += p.z; c.n++
  }
  for (const c of cen.values()) { c.x /= c.n; c.y /= c.n; c.z /= c.n }
  const COHESION = 0.0065
  for (const n of nodes) {
    const p = sim.get(n.id); if (!p) continue
    const c = cen.get(n.group); if (!c || c.n < 2) continue
    p.vx += (c.x - p.x) * COHESION; p.vy += (c.y - p.y) * COHESION; p.vz += (c.z - p.z) * COHESION
  }

  for (const p of arr) {
    p.vx -= p.x * CENTER; p.vy -= p.y * CENTER; p.vz -= p.z * CENTER
    p.vx *= DAMP; p.vy *= DAMP; p.vz *= DAMP
    p.x += p.vx * energy; p.y += p.vy * energy; p.z += p.vz * energy
  }
  energy *= 0.997
}

// ---------------------------------------------------------------- camera + draw
const cv = document.getElementById('c')
const ctx = cv.getContext('2d')
let W = 0, H = 0, DPR = 1
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2)
  // Fall back to the window: on the very first frame a fixed-position canvas can still report 0,
  // and a zero here puts the centre at (0,0), which parks the whole graph in the top-left corner
  // half off screen. It looks like a layout bug and is really a timing one.
  W = cv.clientWidth || window.innerWidth
  H = cv.clientHeight || window.innerHeight
  cv.width = W * DPR; cv.height = H * DPR
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
}
window.addEventListener('resize', () => { resize(); energy = Math.max(energy, 0.5) })

let yaw = 0.6, pitch = -0.3, zoom = 1, panX = 0, panY = 0
const FOV = 520

function project(p) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw)
  const x1 = p.x * cy - p.z * sy
  const z1 = p.x * sy + p.z * cy
  const cp = Math.cos(pitch), sp = Math.sin(pitch)
  const y2 = p.y * cp - z1 * sp
  const z2 = p.y * sp + z1 * cp
  // Perspective divide. `f` doubles as the depth cue: far things are smaller AND fainter, which is
  // what makes a flat canvas read as depth at all.
  //
  // THE NEAR PLANE IS NOT OPTIONAL. Once z2 passes -(FOV + 260) the denominator flips sign, `f`
  // goes negative, and every size derived from it goes negative with it -- at which point the
  // first arc() throws IndexSizeError and the WHOLE canvas stops drawing. The panel still reads
  // the graph, so the map looks empty rather than broken, which is the worst way to fail.
  // An 18-node cloud never spread deep enough to reach it; 87 nodes do.
  const f = FOV / Math.max(60, FOV + z2 + 260)
  return { x: W / 2 + panX + x1 * f * zoom, y: H / 2 + panY + y2 * f * zoom, f, z: z2 }
}

/**
 * The starting zoom, from the size of the graph. Not a computed fit: measuring the projected
 * extent and then SETTING the zoom means the next measurement is taken through the zoom it just
 * applied, and the two chase each other down until the graph is a knot in the middle. Tried it,
 * watched it shrink. Node count is a stable input and a 30-node room is what zoom 1 was tuned for.
 */
function zoomForSize(n) {
  return Math.max(0.35, Math.min(1, Math.sqrt(30 / Math.max(30, n))))
}

let hover = null, selected = null
// Size carries importance. A hub and a leaf being the same dot is what makes an unfamiliar graph
// unreadable -- you cannot tell what matters without tracing every line by eye.
const radiusOf = (n) => n.ghost ? 4.5 : 6 + Math.min(9, Math.sqrt(deg.get(n.id) || 0) * 3.4)

function draw() {
  ctx.clearRect(0, 0, W, H)
  const P = new Map()
  for (const n of nodes) { const p = sim.get(n.id); if (p) P.set(n.id, project(p)) }
  const lit = litSet()
  const isLit = (id) => !lit || lit.has(id)
  const FADE = 0.07

  const drawn = edges.map((e) => ({ e, a: P.get(e.from), b: P.get(e.to) }))
    .filter((o) => o.a && o.b)
    .sort((o1, o2) => (o1.a.z + o1.b.z) - (o2.a.z + o2.b.z))
  const byId = new Map(nodes.map((n) => [n.id, n]))
  for (const { e, a, b } of drawn) {
    const on = isLit(e.from) && isLit(e.to)
    const touching = focusId && (e.from === focusId || e.to === focusId)
    const flow = e.ekind === 'then'
    // An edge takes the colour of the two things it joins. Within a cluster that makes the cluster
    // read as one object; across clusters the line changes hue along its length, so a dependency
    // that leaves its subsystem announces itself instead of disappearing into the pile.
    const na = byId.get(e.from), nb = byId.get(e.to)
    const c = mix(na ? hueOf(na) : GHOST, nb ? hueOf(nb) : GHOST, 0.5)
    // A SEVERE baseline. 113 lines at a readable weight IS the mess -- they cover the nodes and
    // each other. Unlit edges are barely present, lit ones are quiet, and only the neighbourhood
    // you asked about is drawn to be followed by eye.
    const depth = (a.f + b.f) / 2
    ctx.strokeStyle = touching ? 'rgba(140,200,255,.95)'
      : !on ? 'rgba(120,132,160,' + FADE + ')'
      : flow ? `rgba(${c[0]},${c[1]},${c[2]},${0.22 + 0.30 * depth})`
      : `rgba(${c[0]},${c[1]},${c[2]},${0.07 + 0.13 * depth})`
    ctx.lineWidth = touching ? 2.1 : flow ? 1.4 : 0.9
    if (flow && on) { ctx.setLineDash([7, 5]); ctx.lineDashOffset = -(Date.now() / 45) % 12 }
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
    ctx.setLineDash([]); ctx.lineDashOffset = 0
    if (!on) continue
    // Direction tick at 62%. An arrowhead at this line weight turns into mush.
    const t = 0.62, mx = a.x + (b.x - a.x) * t, my = a.y + (b.y - a.y) * t
    const ang = Math.atan2(b.y - a.y, b.x - a.x)
    ctx.beginPath()
    ctx.moveTo(mx, my); ctx.lineTo(mx - 6 * Math.cos(ang - 0.4), my - 6 * Math.sin(ang - 0.4))
    ctx.moveTo(mx, my); ctx.lineTo(mx - 6 * Math.cos(ang + 0.4), my - 6 * Math.sin(ang + 0.4))
    ctx.stroke()
  }

  const order = nodes.map((n) => ({ n, p: P.get(n.id) })).filter((o) => o.p).sort((a, b) => b.p.z - a.p.z)
  const labelQueue = []
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 320)
  for (const { n, p } of order) {
    const on = isLit(n.id)
    const held = heldBy(n)
    const col = hueOf(n)
    // Belt and braces alongside the near plane: arc() THROWS on a negative radius, and the throw
    // escapes the whole draw loop, so one bad node blanks the entire map instead of itself.
    const r = Math.max(0.5, radiusOf(n) * p.f * zoom)

    if (held && on) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 6 + 7 * pulse, 0, 7)
      ctx.fillStyle = 'rgba(255,194,75,' + (0.20 * (1 - pulse)) + ')'; ctx.fill()
    }
    if (on && (n === selected || n === hover)) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 5, 0, 7)
      ctx.strokeStyle = 'rgba(160,215,255,.95)'; ctx.lineWidth = 1.5; ctx.stroke()
    }

    ctx.globalAlpha = on ? 1 : 0.13
    // GLOW, but only where it is earned. shadowBlur is the single most expensive thing in this
    // loop, so it is spent on lit nodes near the camera -- which is exactly where the eye already
    // is. Applying it to all 87 costs frames and, worse, turns the whole field into fog.
    const glow = on && p.f > 0.55 ? Math.min(16, 5 + r * 0.9) : 0
    if (glow) { ctx.shadowColor = rgba(col, 0.85); ctx.shadowBlur = glow }

    // STATE IS THE TREATMENT, not the colour. A solid disc is real, a ring is in progress, a
    // hollow outline is only agreed. That reads at a glance and leaves hue free to say WHERE.
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7)
    if (n.ghost || n.state === 'planned') {
      ctx.strokeStyle = rgba(col, (on ? 0.8 : 0.13) * (0.4 + 0.6 * p.f))
      ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([])
    } else {
      ctx.fillStyle = col; ctx.globalAlpha = (on ? 1 : 0.13) * (0.45 + 0.55 * p.f); ctx.fill()
    }
    ctx.shadowBlur = 0
    ctx.globalAlpha = 1

    // Anything not finished wears a ring in the state colour. Broken pulses, because a thing that
    // is broken and sitting quietly in a corner is how it stays broken.
    if (on && !n.ghost && (n.state === 'broken' || n.state === 'wip')) {
      const sc = STATE_COLOR[n.state]
      ctx.beginPath()
      ctx.arc(p.x, p.y, r + 3.5 + (n.state === 'broken' ? 2.5 * pulse : 0), 0, 7)
      ctx.strokeStyle = rgba(sc, n.state === 'broken' ? 0.55 + 0.45 * pulse : 0.75)
      ctx.lineWidth = n.state === 'broken' ? 2 : 1.4
      ctx.stroke()
    }

    labelQueue.push({ n, p, r, on, held })
  }

  // ---- LABELS, LAST AND BUDGETED --------------------------------------------------------------
  //
  // This is the single biggest thing standing between 87 nodes and a readable picture. Drawing a
  // label per node is 87 pieces of text over a field of 87 dots: the text covers the structure it
  // is supposed to explain, and every label collides with two others.
  //
  // So labels are a scarce resource, spent in priority order and cut off hard:
  //   1. whatever you are pointing at, and whatever you asked for  (always -- you asked)
  //   2. the hubs, by connection count                             (the shape of the thing)
  //   3. nearest the camera, until the budget runs out             (local detail)
  // and a label is skipped entirely if its box would touch one already drawn, so what survives is
  // always legible rather than a pile.
  //
  // Drawn in a second pass so labels sit above every node, not just the ones behind them.
  const focused = !!(focusId || query || filterState || filterGroup)
  const BUDGET = focused ? 26 : 14
  labelQueue.sort((A, B) => {
    const pri = (o) => (o.n === selected || o.n === hover ? 3 : o.n.id === focusId ? 3 : focused && o.on ? 2 : 0)
    const d = pri(B) - pri(A); if (d) return d
    const gd = (deg.get(B.n.id) || 0) - (deg.get(A.n.id) || 0); if (gd) return gd
    return B.p.f - A.p.f
  })
  const taken = []
  let spent = 0
  for (const { n, p, r, on, held } of labelQueue) {
    const forced = n === selected || n === hover || n.id === focusId
    if (!forced) { if (!on || spent >= BUDGET) continue }
    const text = n.label || n.id
    const size = Math.min(15, Math.max(10, 11 * p.f))
    ctx.font = size + 'px ui-sans-serif,system-ui,sans-serif'
    const w = ctx.measureText(text).width
    const box = { x: p.x - w / 2 - 3, y: p.y + r + 3, w: w + 6, h: size + 5 }
    // Rectangle overlap against what is already on screen. O(budget) per label, and the budget is
    // small by construction, so this never shows up in a frame budget.
    if (!forced && taken.some((t) => box.x < t.x + t.w && box.x + box.w > t.x && box.y < t.y + t.h && box.y + box.h > t.y)) continue
    taken.push(box)
    if (!forced) spent++

    ctx.globalAlpha = on ? 1 : 0.22
    // A dark plate behind the text. Without it a label crossing a bright edge or a node is simply
    // unreadable, and at this density something is always behind something.
    ctx.fillStyle = 'rgba(7,8,12,.66)'
    ctx.fillRect(box.x, box.y, box.w, box.h)
    ctx.fillStyle = forced ? '#ffffff' : rgba('#e7e9f0', 0.55 + 0.45 * p.f)
    ctx.textAlign = 'center'
    ctx.textBaseline = 'top'
    ctx.fillText(text, p.x, box.y + 2)
    if (held) {
      ctx.fillStyle = 'rgba(255,194,75,.95)'
      ctx.font = Math.min(13, Math.max(9, 9.5 * p.f)) + 'px ui-sans-serif,system-ui,sans-serif'
      ctx.fillText(held.by + ' · ' + held.intent, p.x, box.y + box.h + 2)
    }
    ctx.textBaseline = 'alphabetic'
    ctx.globalAlpha = 1
  }
  hitmap = order.map(({ n, p }) => ({ n, x: p.x, y: p.y, r: radiusOf(n) * p.f * zoom + 6 }))
}
let hitmap = []

// Fit ONCE, after the force layout has stopped moving. Fitting on the first frame measures a
// cloud that is still flying apart, so the view would settle wrong and stay wrong; and refitting
// forever would fight the viewer every time they zoomed. It re-arms whenever the graph itself
// changes size, because that is a genuinely new shape to frame.
let lastFitCount = -1
function frame() {
  // Re-check every frame rather than trusting one call at startup. The canvas can report 0 on the
  // first frame, and a stale W/H silently moves the centre of the world off screen.
  if (cv.clientWidth && (cv.clientWidth !== W || cv.clientHeight !== H)) { resize(); energy = Math.max(energy, 0.6) }
  step()
  // Set the zoom once for this graph size, then never touch the camera again — it belongs to
  // whoever is driving it.
  if (nodes.length && nodes.length !== lastFitCount) { lastFitCount = nodes.length; zoom = zoomForSize(nodes.length) }
  draw(); requestAnimationFrame(frame)
}

// ---------------------------------------------------------------- interaction
let dragging = false, lastX = 0, lastY = 0, moved = 0, shift = false
cv.addEventListener('pointerdown', (e) => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; shift = e.shiftKey
  cv.classList.add('drag'); cv.setPointerCapture(e.pointerId)
})
cv.addEventListener('pointermove', (e) => {
  if (!dragging) {
    const hit = pick(e.clientX, e.clientY)
    if (hit !== hover) {
      hover = hit
      cv.style.cursor = hit ? 'pointer' : 'grab'
      if (!selected) focusId = hit ? hit.id : null
    }
    return
  }
  const dx = e.clientX - lastX, dy = e.clientY - lastY
  moved += Math.abs(dx) + Math.abs(dy)
  if (shift) { panX += dx; panY += dy }
  else { yaw += dx * 0.006; pitch = Math.max(-1.4, Math.min(1.4, pitch + dy * 0.006)) }
  lastX = e.clientX; lastY = e.clientY
})
cv.addEventListener('pointerup', (e) => {
  dragging = false; cv.classList.remove('drag')
  if (moved < 5) select(pick(e.clientX, e.clientY))
})
cv.addEventListener('wheel', (e) => {
  e.preventDefault()
  zoom = Math.max(0.25, Math.min(4, zoom * (e.deltaY < 0 ? 1.12 : 0.89)))
}, { passive: false })
addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') { yaw = 0.6; pitch = -0.3; panX = panY = 0; zoom = zoomForSize(nodes.length); energy = 1 }
  if (e.key === 'Escape') select(null)
})

function pick(cx, cy) {
  const r = cv.getBoundingClientRect()
  const x = cx - r.left, y = cy - r.top
  // hitmap is far-to-near, so scanning backwards finds the nearest node first.
  for (let i = hitmap.length - 1; i >= 0; i--) {
    const h = hitmap[i]
    if ((x - h.x) ** 2 + (y - h.y) ** 2 <= h.r * h.r) return h.n
  }
  return null
}

const side = document.getElementById('side')
document.getElementById('close').onclick = () => select(null)
function select(n) {
  selected = n
  focusId = n ? n.id : null
  if (!n) { side.classList.remove('show'); return }
  side.classList.add('show')
  document.getElementById('dTitle').textContent = n.label || n.id
  const st = document.getElementById('dState')
  st.textContent = n.ghost ? 'referenced, not defined' : n.state
  st.style.background = (n.ghost ? GHOST : STATE_COLOR[n.state]) + '33'
  st.style.color = n.ghost ? '#aab' : STATE_COLOR[n.state]

  const needs = edges.filter((e) => e.from === n.id)
  const blocks = edges.filter((e) => e.to === n.id)
  const held = heldBy(n)
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const rows = []
  if (held) rows.push(`<div class="k">right now</div><div class="v" style="color:var(--wip)">${esc(held.by)} holds this — ${esc(held.intent)}, ${Math.round(held.left / 1000)}s left</div>`)
  if (n.file) rows.push(`<div class="k">file</div><div class="v">${esc(n.file)}</div>`)
  if (n.kind && n.kind !== 'unknown') rows.push(`<div class="k">kind</div><div class="v">${esc(n.kind)}</div>`)
  if (n.note) rows.push(`<div class="k">note</div><div class="v">${esc(n.note)}</div>`)
  if (needs.length) rows.push(`<div class="k">needs</div><ul>${needs.map((e) => `<li>${esc(e.to)}${e.why ? ' — ' + esc(e.why) : ''}</li>`).join('')}</ul>`)
  if (blocks.length) rows.push(`<div class="k">blocks</div><ul>${blocks.map((e) => `<li>${esc(e.from)}</li>`).join('')}</ul>`)
  if (n.by) rows.push(`<div class="k">last touched by</div><div class="v">${esc(n.by)}</div>`)
  if (n.ghost) rows.push(`<div class="k">why dashed</div><div class="v">Something depends on this, but nobody has added it to the map yet.</div>`)
  document.getElementById('dBody').innerHTML = rows.join('')
}

// ---- controls: search, depth, state filter -------------------------------
// Hover sets the focus, so reading the graph costs no clicks. Selecting pins it, so you can move
// the mouse to the panel without the neighbourhood collapsing behind you.
const qBox = document.getElementById('q')
qBox.addEventListener('input', () => { query = qBox.value.trim(); renderReading() })

for (const b of document.querySelectorAll('.depth button')) {
  b.onclick = () => {
    depth = Number(b.dataset.d)
    for (const o of document.querySelectorAll('.depth button')) o.classList.toggle('on', o === b)
  }
}
document.querySelector('.depth button[data-d="1"]').classList.add('on')

const clearF = document.getElementById('clearF')
for (const sp of document.querySelectorAll('#legend span[data-s]')) {
  sp.onclick = () => {
    filterState = filterState === sp.dataset.s ? null : sp.dataset.s
    for (const o of document.querySelectorAll('#legend span[data-s]')) {
      o.classList.toggle('on', o.dataset.s === filterState)
      o.classList.toggle('off', !!filterState && o.dataset.s !== filterState)
    }
    clearF.style.display = filterState ? 'flex' : 'none'
  }
}
clearF.onclick = () => {
  filterState = null
  for (const o of document.querySelectorAll('#legend span[data-s]')) o.classList.remove('on', 'off')
  clearF.style.display = 'none'
}

resize(); rebuild(); frame()
</script>
</body>
</html>
