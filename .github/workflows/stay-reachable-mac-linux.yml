name: Stay reachable (macOS + Linux)

# Run by hand from the Actions tab. The repo is private, so macOS minutes count ten times over:
# this does not run on every push.
#
# What it answers: the listener, the Stop hook and the wait loop have only ever run on Windows.
# macOS gives every user their own TMPDIR (/var/folders/...); most Linux sets neither TEMP nor
# TMPDIR. The listener's files, and the armed file the Stop hook reads, are found through those.
on:
  workflow_dispatch:

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: listener, stop hook, wait loop, setup, resume, approvals
        run: |
          echo "TEMP=${TEMP:-unset} TMPDIR=${TMPDIR:-unset} os.tmpdir()=$(node -p 'require("os").tmpdir()')"
          fail=0
          for t in hive-await-test.mjs stop-hook-test.mjs mcp-wait-test.mjs mail-identity-test.mjs listener-mail-once-test.mjs system-lines-test.mjs urgent-gate-test.mjs setup-test.mjs session-resume-test.mjs shared-launch-folder-test.mjs task-authority-test.mjs; do
            echo "::group::$t"
            node "tests/$t" || { fail=1; echo "::error::$t failed"; }
            echo "::endgroup::"
          done
          exit $fail
      # What a founder on a Mac touches first, none of it run on macOS before 8 Oct 2026: a personal room
      # and its invites (RSA keys, a key file written 0600), branch rooms (git, and the home folder behind
      # macOS's /var link), case-only renames on a disk that ignores case, secured and self-hosted relays.
      - name: personal rooms, invites, branch rooms, case-only renames, secured and self-hosted relays, unit
        if: always()
        run: |
          fail=0
          for t in test.js eol-mixed-peers-test.mjs merge3-eol-test.mjs personal-room-test.mjs branch-test.mjs branch-fresh-test.mjs case-rename-test.mjs case-collision-test.mjs secured-invite-test.mjs self-host-test.mjs relay-pin-test.mjs; do
            echo "::group::$t"
            node "tests/$t" || { fail=1; echo "::error::$t failed"; }
            echo "::endgroup::"
          done
          exit $fail
      # The GitHub watcher and the room notifier, first written on Windows (13 Oct 2026). What differs
      # here: agent CLIs start through sh, a run's processes are killed as a process group rather than
      # with taskkill, and the agent's folder sits behind macOS's /var link.
      - name: GitHub watcher, room notifier
        if: always()
        run: |
          fail=0
          for t in github-cli-test.mjs notify-test.mjs github-watcher-test.mjs; do
            echo "::group::$t"
            node "tests/$t" || { fail=1; echo "::error::$t failed"; }
            echo "::endgroup::"
          done
          exit $fail
      # Slack (8 Nov 2026): the bridge, the agent panel, and replies read over HTTPS when a network
      # refuses Slack's WebSocket (Antigravity's VM). Fake Slack + the real relay, no Slack account.
      - name: Slack bridge, HTTPS reply polling
        if: always()
        run: |
          fail=0
          for t in entry-point-test.mjs hive-slack-test.mjs hive-slack-agent-test.mjs slack-poll-inbound-test.mjs slack-control-confirm-test.mjs slack-poller-cursor-test.mjs slack-relay-test.mjs slack-relay-e2e-test.mjs slack-connect-test.mjs slack-oauth-test.mjs slack-one-click-e2e-test.mjs; do
            echo "::group::$t"
            node "tests/$t" || { fail=1; echo "::error::$t failed"; }
            echo "::endgroup::"
          done
          exit $fail
      # Room mode and the one landing path (5 Nov 2026), written and run only on Windows until now:
      # temporary git worktrees, the landing lock, tests run on the exact commit and stopped as a
      # process group, the watcher's state under .git/hivecode, hive_pr and hive_review over MCP.
      - name: room mode, landing, hive_pr, reviews
        if: always()
        run: |
          fail=0
          for t in land-test.mjs hive-pr-test.mjs hive-pr-tool-test.mjs hive-issue-tool-test.mjs gh-action-test.mjs gh-action-workflow-test.mjs gh-action-retry-test.mjs review-test.mjs room-watcher-test.mjs room-mode-e2e-test.mjs room-mode-issue-test.mjs room-mode-start-test.mjs room-mode-land-test.mjs room-mode-pr-comments-test.mjs room-start-cli-test.mjs release-check-test.mjs version-truth-test.mjs poll-fallback-test.mjs await-rebuilt-room-test.mjs poll-transport-test.mjs poll-vm-e2e-test.mjs proxy-connect-test.mjs proxy-tools-test.mjs proxy-fetch-test.mjs new-file-latency-test.mjs join-honesty-test.mjs phantom-held-edit-test.mjs handover-edit-test.mjs revert-agent-test.mjs hive-pr-crlf-test.mjs handover-edit-adversarial-test.mjs working-set-adversarial-test.mjs crlf-sweep-test.mjs; do
            echo "::group::$t"
            node "tests/$t" || { fail=1; echo "::error::$t failed"; }
            echo "::endgroup::"
          done
          exit $fail
      # 0.14.3 (9 Nov 2026): writes over long-poll that survive leaving, edits made before a file synced,
      # the seed-aware staleness check, the ICR await upgrade, case-only renames, the mixed-build alarm.
      - name: 0.14.3 fixes
        if: always()
        run: |
          fail=0
          for t in poll-write-on-exit-test.mjs presync-edit-test.mjs seed-staleness-test.mjs provenance-presync-test.mjs icr-await-upgrade-test.mjs stacked-await-test.mjs delete-resurrect-test.mjs mixed-build-test.mjs; do
            echo "::group::$t"
            node "tests/$t" || { fail=1; echo "::error::$t failed"; }
            echo "::endgroup::"
          done
          exit $fail
      # 0.14.4: a room's gate runs only with this machine's consent, [!] after the names, joins that
      # refuse a case-only twin and say whether the listener runs, the rules from one source, and the
      # first-contact summary (whose 0.14.3 regression no CI step caught: it ran only in test:hardening).
      - name: 0.14.4 fixes
        if: always()
        run: |
          fail=0
          for t in gate-consent-test.mjs hive-gate-test.mjs mailbox-test.mjs case-fold-join-test.mjs listener-status-test.mjs duplicate-name-test.mjs rules-promises-test.mjs first-contact-refusal-test.mjs; do
            echo "::group::$t"
            node "tests/$t" || { fail=1; echo "::error::$t failed"; }
            echo "::endgroup::"
          done
          exit $fail
      # 0.14.5: two saves of the same line give a conflict block, never a line nobody wrote: on time,
      # late, and at random lateness (the soak). Plus the merge rule's git parity, neighbouring lines,
      # blank lines, the extension's generated bundle, and first contact with CRLF files.
      - name: 0.14.5 fixes
        if: always()
        run: |
          fail=0
          for t in same-line-intent-unit-test.mjs same-line-fuzz-test.mjs late-save-merge-test.mjs adjacent-lines-merge-test.mjs same-line-late-unit-test.mjs icr-blank-lines-test.mjs diff3-test.mjs same-line-race-test.mjs same-line-later-save-test.mjs same-line-very-late-test.mjs same-line-soak-test.mjs first-contact-summary-test.mjs extension-parity-test.mjs; do
            echo "::group::$t"
            node "tests/$t" || { fail=1; echo "::error::$t failed"; }
            echo "::endgroup::"
          done
          exit $fail
