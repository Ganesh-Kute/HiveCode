name: 'Hivecode Semantic Drift Gate'
description: 'Blocks PRs if the Semantic Drift Index (Ds) > 0.15 or if Phantom Regressions are detected.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  base_sha:
    description: 'The base commit SHA'
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head_sha:
    description: 'The head commit SHA'
    required: false
    default: ${{ github.event.pull_request.head.sha }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --ignore-scripts
      shell: bash

    - name: Run git-clash engine
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: node "${{ github.action_path }}/packages/git-clash/cli.mjs" --scan --base="$BASE_SHA" --head="$HEAD_SHA"
      shell: bash
